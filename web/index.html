<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Door Cam</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="site-title">Door Cam</h1>
      <div
        id="connection-indicator"
        class="conn-indicator conn-unknown"
        role="status"
        aria-live="polite"
        aria-label="Connection status: unknown"
        title="Checking connection..."
      >
        <span class="conn-dot" aria-hidden="true"></span>
        <span class="conn-label">Checking…</span>
      </div>
    </header>

    <main class="main">
      <section class="video-section" aria-label="Camera video">
        <div class="video-frame" id="video-frame">
          <!-- Populated by app.js: either an <img> stream, a placeholder, or an error panel -->
        </div>
      </section>

      <section class="controls" aria-label="Camera controls">
        <button
          type="button"
          id="toggle-btn"
          class="toggle-btn"
          aria-live="polite"
          disabled
        >
          Loading…
        </button>
      </section>

      <section class="status-bar" aria-label="Camera status">
        <div class="status-tile" id="tile-state">
          <div class="status-label">State</div>
          <div class="status-value" id="status-state">—</div>
        </div>
        <div class="status-tile" id="tile-fps">
          <div class="status-label">FPS</div>
          <div class="status-value" id="status-fps">—</div>
        </div>
        <div class="status-tile" id="tile-resolution">
          <div class="status-label">Resolution</div>
          <div class="status-value" id="status-resolution">—</div>
        </div>
        <div class="status-tile" id="tile-uptime">
          <div class="status-label">Uptime</div>
          <div class="status-value" id="status-uptime">—</div>
        </div>
        <div class="status-tile" id="tile-battery">
          <div class="status-label">Battery</div>
          <div class="status-value" id="status-battery">—</div>
        </div>
        <div class="status-tile" id="tile-camera">
          <div class="status-label">Camera</div>
          <div class="status-value">
            <span
              id="status-camera-dot"
              class="cam-dot cam-unknown"
              aria-hidden="true"
            ></span>
            <span id="status-camera-text">—</span>
          </div>
        </div>
      </section>
    </main>

    <div
      id="toast"
      class="toast"
      role="alert"
      aria-live="assertive"
      hidden
    ></div>

    <script src="/static/app.js"></script>
  </body>
</html>
