<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoorCam · Hub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2300ff88'/></svg>">
<style>
  :root {
    --bg: #0d0d0e;
    --card: #18181b;
    --card-hover: #1f1f23;
    --border: #2a2a2e;
    --text: #e5e5e5;
    --text-muted: #888;
    --accent: #00ff88;
    --accent-dim: rgba(0, 255, 136, 0.14);
    --error: #c66;
    --error-dim: rgba(204, 102, 102, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.4;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  header h1 {
    margin: 0;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  header h1 .accent { color: var(--accent); margin: 0 6px; }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.8rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  /* iOS-style toggle for detection on/off. */
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle .toggle-label { color: var(--text); font-size: 0.85rem; }
  .toggle-track {
    position: relative;
    width: 36px;
    height: 18px;
    background: #2a2a2e;
    border-radius: 9px;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #888;
    transition: left 0.18s, background 0.18s;
  }
  .toggle input:checked ~ .toggle-track { background: var(--accent-dim); }
  .toggle input:checked ~ .toggle-track .toggle-thumb {
    left: 20px;
    background: var(--accent);
    box-shadow: 0 0 6px rgba(0, 255, 136, 0.5);
  }
  .toggle.is-pending .toggle-thumb { opacity: 0.5; }
  .toggle.is-error ~ .toggle-track { background: var(--error-dim); }

  button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  button:hover {
    border-color: var(--text-muted);
    background: var(--card-hover);
    color: #fff;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px 24px 40px;
  }

  .section-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 16px 0 8px;
  }
  main > .section-label:first-child { margin-top: 0; }

  /* Detection error banner under the header. */
  .banner {
    background: var(--error-dim);
    border: 1px solid rgba(204, 102, 102, 0.4);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .banner .banner-title {
    color: var(--error);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .banner code {
    background: rgba(0, 0, 0, 0.4);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--accent);
    font-size: 0.85em;
  }

  /* Cameras section. */
  .cameras {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-bottom: 8px;
  }
  .camera {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .camera-frame {
    aspect-ratio: 4 / 3;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .camera-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .camera-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  .camera-bar .camera-name {
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .camera-bar .camera-state-on { color: var(--accent); }
  .camera-bar .camera-state-off { color: var(--text-muted); }

  /* Events list. */
  .events {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .event {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: background 0.15s, border-color 0.15s;
  }
  .event:hover { background: var(--card-hover); }
  .event[data-expanded="true"] {
    background: var(--card-hover);
    border-color: var(--accent-dim);
  }

  .event-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }

  .event-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 0.7rem;
  }
  .event[data-expanded="true"] .event-icon {
    background: var(--accent);
    color: #000;
  }

  .event-meta { flex: 1 1 auto; min-width: 0; }
  .event-title {
    font-size: 0.95rem;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .event-sub {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }
  .event-sub span::after {
    content: " ·";
    color: var(--border);
    margin-left: 6px;
  }
  .event-sub span:last-child::after { content: ""; }
  .event-time {
    font-size: 0.82rem;
    color: var(--text-muted);
    flex-shrink: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .event-player {
    border-top: 1px solid var(--border);
    padding: 14px;
    display: none;
    background: #0a0a0b;
  }
  .event[data-expanded="true"] .event-player { display: block; }
  .event-player video {
    width: 100%;
    max-height: 70vh;
    border-radius: 4px;
    background: #000;
    display: block;
  }
  .event-actions {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .event-actions a { color: var(--accent); text-decoration: none; }
  .event-actions a:hover { text-decoration: underline; }
  .event-no-clip {
    color: var(--text-muted);
    font-size: 0.9rem;
    font-style: italic;
    text-align: center;
    padding: 24px 12px;
  }

  .empty {
    text-align: center;
    padding: 32px 24px;
    color: var(--text-muted);
    font-size: 0.9rem;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }
  .empty code {
    background: var(--card);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--accent);
    font-size: 0.9em;
  }

  .pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  @media (max-width: 600px) {
    header { padding: 10px 14px; }
    main { padding: 14px; }
    .event-summary { padding: 10px 12px; gap: 10px; }
    .event-time { font-size: 0.75rem; }
    .event-title { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<header>
  <h1>DoorCam<span class="accent">·</span>Hub</h1>
  <div class="header-meta">
    <label class="toggle" id="detection-toggle-label" title="Toggle person detection">
      <input type="checkbox" id="detection-toggle">
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-label">Detection</span>
    </label>
    <span id="status"><span class="pulse"></span>loading…</span>
    <button id="refresh" title="Refresh now">Refresh</button>
  </div>
</header>

<main>
  <div id="banner"></div>
  <div class="section-label">Cameras</div>
  <div id="cameras"></div>
  <div class="section-label">Events</div>
  <div id="events">
    <div class="empty">Loading events…</div>
  </div>
</main>

<script>
(function () {
    "use strict";

    const REFRESH_MS = 15_000;
    const LIMIT = 100;

    const banner = document.getElementById("banner");
    const camerasEl = document.getElementById("cameras");
    const eventsEl = document.getElementById("events");
    const status = document.getElementById("status");
    const refreshBtn = document.getElementById("refresh");
    const toggleInput = document.getElementById("detection-toggle");
    const toggleLabel = document.getElementById("detection-toggle-label");

    let refreshTimer = null;
    let camerasRendered = false;
    let detectionPending = false;
    let lastDetectionState = null;

    async function fetchJson(url, init) {
        const res = await fetch(url, Object.assign({ cache: "no-store" }, init || {}));
        const text = await res.text();
        let body;
        try { body = text ? JSON.parse(text) : null; } catch (_) { body = null; }
        if (!res.ok) {
            const err = new Error((body && (body.error || body.detail)) || ("HTTP " + res.status));
            err.status = res.status;
            err.body = body;
            throw err;
        }
        return body;
    }

    async function load(initial) {
        try {
            // 1. Detection state — drives the toggle + banner.
            try {
                const detection = await fetchJson("/detection");
                applyDetectionState(detection);
            } catch (err) {
                applyDetectionState({ enabled: false, available: false, error: err.message });
            }

            // 2. Camera list — render thumbnails ONCE so MJPEG streams aren't
            //    torn down on every auto-refresh.
            const cams = await fetchJson("/cams");
            if (!camerasRendered) {
                renderCameras(cams);
                camerasRendered = true;
            } else {
                updateCameraStates(cams);
            }

            // 3. Events. Even if detection is currently off, the store may
            //    still have past rows worth showing.
            const allEvents = [];
            let storeUnavailable = false;
            for (const cam of cams) {
                try {
                    const events = await fetchJson("/cam/" + encodeURIComponent(cam.cam_id) + "/events?limit=" + LIMIT);
                    for (const e of events) allEvents.push(e);
                } catch (err) {
                    if (err.status === 503) { storeUnavailable = true; break; }
                    throw err;
                }
            }
            if (storeUnavailable) {
                renderEventsEmpty('Event store unavailable. Enable detection above to start capturing events.');
            } else {
                allEvents.sort((a, b) => b.started_at_ms - a.started_at_ms);
                renderEvents(allEvents);
            }
            setStatus("updated " + new Date().toLocaleTimeString());
        } catch (err) {
            setStatus("error");
            renderEventsEmpty('<span style="color:var(--error)">Error loading events: ' + escapeHtml(err.message) + '</span>');
        }
        schedule();
    }

    function schedule() {
        if (refreshTimer) clearTimeout(refreshTimer);
        // Don't refresh while a video is playing; the events list re-render
        // would tear the player down.
        const playing = document.querySelector(".event[data-expanded='true'] video");
        const isPlaying = playing && !playing.paused && !playing.ended;
        refreshTimer = setTimeout(isPlaying ? schedule : load, REFRESH_MS);
    }

    function setStatus(text) {
        status.innerHTML = "";
        status.textContent = text;
    }

    /* ---- Detection toggle ---- */

    function applyDetectionState(state) {
        lastDetectionState = state;
        toggleInput.checked = !!state.enabled;
        toggleLabel.classList.toggle("is-error", !!state.error);
        toggleLabel.classList.toggle("is-pending", detectionPending);

        banner.innerHTML = "";
        if (state.error) {
            const div = document.createElement("div");
            div.className = "banner";
            div.innerHTML =
                '<div class="banner-title">Detection couldn\'t start</div>' +
                '<div>' + escapeHtml(state.error) + '</div>' +
                '<div style="margin-top:6px;color:var(--text-muted);font-size:0.85em;">' +
                'Most common cause: <code>better-sqlite3</code> wasn\'t built against the Node version MagicMirror runs under. ' +
                'Re-run <code>./mm_module/install.sh</code> on the hub Pi using the same Node that starts MagicMirror, then restart MagicMirror.' +
                '</div>';
            banner.appendChild(div);
        }
    }

    toggleInput.addEventListener("change", async (ev) => {
        if (detectionPending) return;
        const wantEnabled = ev.target.checked;
        detectionPending = true;
        toggleLabel.classList.add("is-pending");
        toggleInput.disabled = true;
        try {
            const newState = await fetchJson("/detection", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ enabled: wantEnabled })
            });
            applyDetectionState(newState);
        } catch (err) {
            // Server returned non-2xx; the body still contains the new state.
            applyDetectionState(err.body || { enabled: false, error: err.message });
        } finally {
            detectionPending = false;
            toggleInput.disabled = false;
            toggleLabel.classList.remove("is-pending");
            // Detection toggling can change which events the store has;
            // refresh now to show that.
            if (refreshTimer) clearTimeout(refreshTimer);
            load();
        }
    });

    /* ---- Cameras ---- */

    function renderCameras(cams) {
        camerasEl.replaceChildren();
        if (!cams || cams.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "No cameras have ever connected to the hub.";
            camerasEl.appendChild(empty);
            return;
        }
        const grid = document.createElement("div");
        grid.className = "cameras";
        for (const cam of cams) grid.appendChild(renderCamera(cam));
        camerasEl.appendChild(grid);
    }

    function renderCamera(cam) {
        const card = document.createElement("div");
        card.className = "camera";
        card.dataset.camId = cam.cam_id;

        const frame = document.createElement("div");
        frame.className = "camera-frame";
        renderCameraFrame(frame, cam);
        card.appendChild(frame);

        const bar = document.createElement("div");
        bar.className = "camera-bar";
        const name = document.createElement("span");
        name.className = "camera-name";
        name.textContent = cam.cam_id;
        bar.appendChild(name);
        const state = document.createElement("span");
        state.className = "camera-state " + (cam.state === "on" ? "camera-state-on" : "camera-state-off");
        state.textContent = describeCamState(cam);
        bar.appendChild(state);
        card.appendChild(bar);

        return card;
    }

    function renderCameraFrame(frame, cam) {
        frame.replaceChildren();
        if (cam.connected && cam.state === "on") {
            const img = document.createElement("img");
            img.alt = cam.cam_id + " live feed";
            // Cache-bust on initial load only — afterwards the MJPEG stream
            // keeps the connection alive on its own.
            img.src = "/cam/" + encodeURIComponent(cam.cam_id) + "/stream.mjpg?t=" + Date.now();
            frame.appendChild(img);
        } else {
            const placeholder = document.createElement("div");
            if (!cam.connected) {
                placeholder.textContent = "camera offline";
            } else {
                placeholder.textContent = "camera off";
            }
            frame.appendChild(placeholder);
        }
    }

    function updateCameraStates(cams) {
        for (const cam of cams) {
            const card = camerasEl.querySelector('.camera[data-cam-id="' + cssEscape(cam.cam_id) + '"]');
            if (!card) continue;
            const bar = card.querySelector(".camera-bar .camera-state");
            if (bar) {
                bar.className = "camera-state " + (cam.state === "on" ? "camera-state-on" : "camera-state-off");
                bar.textContent = describeCamState(cam);
            }
            // If the cam transitioned off → on (or offline → connected), we
            // need a fresh <img> to reopen the MJPEG. Detect by checking
            // whether the frame currently has an <img>.
            const frame = card.querySelector(".camera-frame");
            const hasImg = frame && frame.querySelector("img");
            const wantImg = cam.connected && cam.state === "on";
            if (frame && (!hasImg && wantImg || hasImg && !wantImg)) {
                renderCameraFrame(frame, cam);
            }
        }
    }

    function describeCamState(cam) {
        if (!cam.connected) return "offline";
        if (cam.state === "on") return "live";
        return "off";
    }

    function cssEscape(s) {
        // Minimal escape for use inside a [data-cam-id="..."] selector.
        return String(s).replace(/(["\\])/g, "\\$1");
    }

    /* ---- Events ---- */

    function renderEvents(events) {
        if (events.length === 0) {
            renderEventsEmpty('No events captured yet. Walk past the camera to trigger one.');
            return;
        }
        const expandedId = currentlyExpandedId();
        const ul = document.createElement("ul");
        ul.className = "events";
        for (const e of events) {
            const li = renderEvent(e);
            if (e.id === expandedId) {
                li.dataset.expanded = "true";
                renderPlayer(li.querySelector(".event-player"), e);
            }
            ul.appendChild(li);
        }
        eventsEl.replaceChildren(ul);
    }

    function renderEventsEmpty(html) {
        const div = document.createElement("div");
        div.className = "empty";
        div.innerHTML = html;
        eventsEl.replaceChildren(div);
    }

    function renderEvent(e) {
        const li = document.createElement("li");
        li.className = "event";
        li.dataset.expanded = "false";
        li.dataset.eventId = String(e.id);

        const summary = document.createElement("div");
        summary.className = "event-summary";

        const icon = document.createElement("div");
        icon.className = "event-icon";
        icon.textContent = "▶";
        summary.appendChild(icon);

        const meta = document.createElement("div");
        meta.className = "event-meta";

        const title = document.createElement("div");
        title.className = "event-title";
        title.textContent = capitalize(e.type || "event") + " detected";
        meta.appendChild(title);

        const sub = document.createElement("div");
        sub.className = "event-sub";
        sub.appendChild(makeSpan(e.cam_id));
        if (e.duration_ms) sub.appendChild(makeSpan(formatDuration(e.duration_ms)));
        if (e.detection_count) sub.appendChild(makeSpan(e.detection_count + " detections"));
        if (typeof e.max_confidence === "number") {
            sub.appendChild(makeSpan(Math.round(e.max_confidence * 100) + "% confidence"));
        }
        if (!e.clip_path) sub.appendChild(makeSpan("no clip"));
        meta.appendChild(sub);
        summary.appendChild(meta);

        const time = document.createElement("div");
        time.className = "event-time";
        time.textContent = formatTime(e.started_at_ms);
        summary.appendChild(time);

        const player = document.createElement("div");
        player.className = "event-player";

        li.appendChild(summary);
        li.appendChild(player);

        summary.addEventListener("click", () => toggle(li, e));
        return li;
    }

    function toggle(li, e) {
        const wasOpen = li.dataset.expanded === "true";
        document.querySelectorAll('.event[data-expanded="true"]').forEach((other) => {
            if (other === li) return;
            other.dataset.expanded = "false";
            other.querySelector(".event-player").replaceChildren();
        });
        if (wasOpen) {
            li.dataset.expanded = "false";
            li.querySelector(".event-player").replaceChildren();
        } else {
            li.dataset.expanded = "true";
            renderPlayer(li.querySelector(".event-player"), e);
            li.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
    }

    function renderPlayer(container, e) {
        container.replaceChildren();
        if (!e.clip_path) {
            container.appendChild(textDiv("event-no-clip",
                "No clip recorded for this event (was ffmpeg available when it was captured?)."));
            return;
        }
        const ext = (e.clip_path.match(/\.(mkv|mp4)$/i) || [".mkv"])[0];
        const url = "/events/" + e.id + "/clip" + ext;

        const video = document.createElement("video");
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.src = url;
        video.addEventListener("error", () => {
            const note = textDiv("event-no-clip",
                "Your browser couldn't decode this clip (MKV/MJPEG isn't universal). " +
                "Use the download link below, or switch the hub's recording.codec to \"h264\" for broader compatibility.");
            container.appendChild(note);
        });
        container.appendChild(video);

        const actions = document.createElement("div");
        actions.className = "event-actions";

        const dl = document.createElement("a");
        dl.href = url;
        dl.download = e.clip_path.split("/").pop();
        dl.textContent = "Download";
        actions.appendChild(dl);

        const pathSpan = document.createElement("span");
        pathSpan.textContent = e.clip_path;
        actions.appendChild(pathSpan);

        container.appendChild(actions);
        video.play().catch(() => { /* autoplay may be blocked; controls still work */ });
    }

    function currentlyExpandedId() {
        const el = document.querySelector('.event[data-expanded="true"]');
        return el ? Number(el.dataset.eventId) : null;
    }

    /* ---- helpers ---- */

    function makeSpan(text) {
        const s = document.createElement("span");
        s.textContent = text;
        return s;
    }
    function textDiv(cls, text) {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        return d;
    }
    function formatTime(ms) {
        const d = new Date(ms);
        const today = new Date();
        const sameDay = d.toDateString() === today.toDateString();
        const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        if (sameDay) return time;
        const date = d.toLocaleDateString([], { month: "short", day: "numeric" });
        return date + " " + time;
    }
    function formatDuration(ms) {
        if (ms < 1000) return ms + " ms";
        const s = ms / 1000;
        if (s < 60) return s.toFixed(1) + "s";
        const m = Math.floor(s / 60);
        return m + "m " + Math.round(s - m * 60) + "s";
    }
    function capitalize(s) {
        if (!s) return "";
        return s.charAt(0).toUpperCase() + s.slice(1);
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    refreshBtn.addEventListener("click", () => {
        if (refreshTimer) clearTimeout(refreshTimer);
        setStatus("refreshing…");
        load();
    });

    load(true);
})();
</script>
</body>
</html>
