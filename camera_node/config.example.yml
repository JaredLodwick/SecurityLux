# SecurityLux camera_node — example configuration.
#
# Copy this file to `config.yml` (same directory) or `/etc/camera-node/config.yml`
# and edit values to taste. The service picks up config in this order:
#   1. path in the CAMERA_NODE_CONFIG env var
#   2. /etc/camera-node/config.yml
#   3. ./config.yml  (working directory)
#   4. built-in defaults (shown below)

hub:
  # WebSocket URL of SecurityLuxHub. The camera connects out to
  # <url>/cam/<camera.id>; the hub buffers frames and forwards on/off
  # commands back over the same socket.
  url: ws://meer.local:5000

camera:
  # Stable identifier this camera registers under on the hub. Viewers use the
  # same id to select which camera to display.
  id: front
  # V4L2 device node. `/dev/video0` is the usual first USB UVC webcam.
  device: /dev/video0
  # Capture resolution [width, height]. Keep modest on a Pi Zero 2 W.
  resolution: [640, 480]
  # Soft cap for capture + encode loop (frames per second).
  fps: 15
  # JPEG encoding quality 1-100. Higher = larger frames, more bandwidth.
  jpeg_quality: 70

pisugar:
  # PiSugar daemon runs locally on the Pi over TCP.
  host: 127.0.0.1
  port: 8423
  # Seconds to wait for any PiSugar socket response before giving up.
  timeout_seconds: 1.0

image:
  # Framing adjustments, applied on this Pi before the JPEG is encoded — so the
  # live feed, the hub's recordings, and the person detector all see the same
  # corrected picture.
  #
  # These are bootstrap values only. The hub pushes the authoritative settings
  # on connect, and you normally change them in the web UI (camera →
  # "Adjust image"), where you get a live preview.
  #
  # rotation: 0, 90, 180 or 270, clockwise. 90 and 270 swap width and height.
  # zoom:     1.0 = full frame, up to 4.0. Digital, so no extra detail — but it
  #           fills the frame with the part you care about, and the detector
  #           then sees a larger person.
  # panX/panY: -1 to 1, which part of the frame to zoom into. No effect at 1x.
  #
  # Brightness, contrast and exposure are NOT here: which of those a camera
  # supports depends entirely on the webcam, so they're detected at runtime
  # and stored on the hub. Install v4l-utils to enable them.
  rotation: 0
  flipHorizontal: false
  flipVertical: false
  zoom: 1.0
  panX: 0.0
  panY: 0.0

led:
  # Optional WS281x / NeoPixel strip that lights up when someone is at the door.
  #
  # Wiring (SPI — no root required, no conflict with onboard audio):
  #   DIN  -> GPIO10 / MOSI, physical pin 19
  #   GND  -> any Pi GND, e.g. physical pin 6   <- a common ground is mandatory
  #   5V   -> 5V supply
  #
  # Enable SPI first:  sudo raspi-config > Interface Options > SPI > Yes
  # Then add this to /boot/firmware/config.txt so CPU scaling can't drift the
  # SPI clock and corrupt WS2812 timing:
  #   core_freq_min=500
  #
  # POWER: eight LEDs at full white draw ~480 mA. That is more than the Pi
  # Zero's 5V rail wants to give while a PiSugar is charging. Keep brightness
  # capped, or feed the strip from its own 5V supply with a shared ground.
  #
  # These values only apply until the hub connects — it then pushes the
  # authoritative settings, which you edit per camera in the web UI.
  enabled: false
  count: 8
  max_brightness: 0.4

logging:
  # Standard Python logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level: INFO
