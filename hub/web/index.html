<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>SecurityLuxHub</title>
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2300ff88'/></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header>
  <h1><span class="brand">Security Lux</span></h1>
  <nav class="tabs" id="tabs">
    <a href="#/live">Live</a>
    <a href="#/events">Events</a>
    <a href="#/profiles">Profiles</a>
    <a href="#/settings">Settings</a>
    <a href="#/storage">Storage</a>
  </nav>
  <span class="system-status" id="system-status" data-state="loading">
    <span>Hub</span>
    <span class="system-dot"></span>
  </span>
</header>

<main>
  <div id="banners"></div>
  <div id="view"></div>
</main>

<!--
  Load order matters: stream-keeper and util define globals the rest depend on.
  No bundler on purpose — the hub is a LAN appliance and must serve a working
  dashboard with no build step and no internet route.
-->
<script src="/js/stream-keeper.js"></script>
<script src="/js/util.js"></script>
<script src="/js/cameras.js"></script>
<script src="/js/events.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/zones.js"></script>
<script src="/js/profiles.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
